name: UCID Update

on:
  schedule:
    # ตั้งเวลาเป็น 00:00 UTC ซึ่งจะตรงกับ 07:00 น. ตามเวลาประเทศไทย (UTC+7)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-updater:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Node 20/24 is used by v4
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          CMC_PRO_API_KEY: ${{ secrets.CMC_PRO_API_KEY }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: python main.py